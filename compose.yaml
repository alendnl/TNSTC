services:
  tnstc:
    build:
      context: .
    container_name: tnstc-bus-notifier
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-60}
    restart: unless-stopped
    volumes:
      - ./bus_details.html:/app/bus_details.html